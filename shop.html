<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | MamaCraftHouz</title>
<meta name="description" content="Browse personalized champagne flutes, ornaments, Easter baskets, custom shirts, tumblers and gift bundles.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MamaCraftHouz">
<meta property="og:title" content="Shop | MamaCraftHouz">
<meta property="og:description" content="Browse personalized champagne flutes, ornaments, Easter baskets, custom shirts, tumblers and gift bundles.">
<meta property="og:image" content="images/products/cat-gifts.svg">
<meta name="theme-color" content="#5c4130">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>
<main id="main" tabindex="-1">

<section class="page-head">
  <div class="container">
    <h1>Shop</h1>
    <p class="lead">Everything is made to order. Pick a favorite and add your personal touch.</p>
  </div>
</section>
<section class="section-tight">
  <div class="container">
    <div class="shop-controls">
      <div class="field search-field">
        <label for="search">Search the shop</label>
        <input type="search" id="search" placeholder="Try &quot;wedding&quot; or &quot;ornament&quot;" autocomplete="off">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    </div>
    <p class="result-count" id="result-count" aria-live="polite"></p>
    <div id="products" class="grid" aria-busy="true"></div>
    <div id="bundles-block" hidden>
      <h2 class="section-title bundles-title" id="bundles-heading">Bundles &amp; Gift Sets</h2>
      <div id="bundles" class="grid"></div>
    </div>
    <div id="empty" class="notice" hidden>
      <p>Nothing matches that search. Try a different word, or <a href="custom-order.html">request something custom</a>.</p>
    </div>
  </div>
</section>

</main>
<footer class="site-footer" id="site-footer"></footer>
<noscript><p class="notice">Please enable JavaScript to browse the shop.</p></noscript>
<script type="module">
import { initLayout } from "./js/layout.js";
initLayout("shop");
</script>
<script type="module" src="js/shop.js"></script>
</body>
</html>
